# Deploy the NailTrack API (backend/) to Azure App Service.
# The React PWA is added in Phase 4 and is not part of this workflow.
#
# Required repository secrets:
#   AZURE_WEBAPP_NAME              App Service name
#   AZURE_WEBAPP_PUBLISH_PROFILE   Download from the App Service Deployment Center
#
# OIDC alternative (not selected here): create a federated credential for this
# repo and swap the deploy step for azure/login plus azure/webapps-deploy
# using AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID.
# See README "Azure App Service".
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/azure-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libglib2.0-0 libgomp1
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --force-reinstall --no-deps "opencv-python-headless==5.0.0.93"
      - name: Run tests
        working-directory: backend
        run: pytest

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
