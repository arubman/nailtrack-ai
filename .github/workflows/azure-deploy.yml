# Deploy the API (backend/) to Azure App Service and the PWA (frontend/) to
# Azure Static Web Apps.
#
# Backend secrets:
#   AZURE_WEBAPP_NAME
#   AZURE_WEBAPP_PUBLISH_PROFILE
# OIDC alternative: federated credential for
# repo:arubman/nailtrack-ai:ref:refs/heads/main, then azure/login with
# AZURE_CLIENT_ID, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID.
#
# Frontend secret:
#   AZURE_STATIC_WEB_APPS_API_TOKEN   Static Web App → Manage deployment token
# Frontend repository variables (baked into the production build):
#   VITE_API_BASE_URL                 App Service origin, no trailing slash
#   VITE_AUTH_MODE                    entra (or dev only for a private demo)
#   VITE_ENTRA_CLIENT_ID
#   VITE_ENTRA_AUTHORITY              https://<subdomain>.ciamlogin.com/<tenant-id>
#   VITE_API_SCOPE                    api://<api-app-id>/access_as_user
# The App Service setting CORS_ORIGINS must include the Static Web Apps origin.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/azure-deploy.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/azure-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libglib2.0-0 libgomp1
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --force-reinstall --no-deps "opencv-python-headless==5.0.0.93"
      - name: Run tests
        working-directory: backend
        run: pytest

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_AUTH_MODE: dev
          VITE_API_BASE_URL: http://127.0.0.1:8000

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

  deploy-frontend:
    needs: frontend-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy PWA to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE != '' && vars.VITE_AUTH_MODE || 'entra' }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
          VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
